# `pnpm package` builds release/mac-<arch>/Browser.app. See README "Build a macOS app".
appId: dev.narze.browser
productName: Browser
directories:
  output: release
  buildResources: build
files:
  - package.json
  - electron/**/*.cjs
  - shared/**/*.js
  - dist/**
mac:
  target: dir
  category: public.app-category.productivity
  icon: build/icon.png
  # Ad-hoc signature: enough to run on this Mac. Gatekeeper on other Macs needs a Developer ID.
  identity: "-"
  # The hardened runtime needs a Developer ID signature; ad-hoc apps fail to launch with it.
  hardenedRuntime: false
protocols:
  - name: Web page
    schemes: [http, https]
    role: Viewer
